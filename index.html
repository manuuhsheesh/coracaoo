<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neon Heart - I Love You</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>

<canvas id="c"></canvas>

<script>

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let W, H, CX, CY, SCALE;

const DPR = Math.min(window.devicePixelRatio || 1, 2);

const TOTAL = 65;
const TEXT = "I love you";

const points = [];

function resize() {

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W * DPR;
    canvas.height = H * DPR;

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(DPR, DPR);

    CX = W / 2;
    CY = H / 2;

    SCALE = Math.min(W, H) * 0.021;

    createPoints();
}

function heart(t) {

    const x =
        16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    return {
        x: x * SCALE,
        y: -y * SCALE
    };
}

function createPoints() {

    points.length = 0;

    for (let i = 0; i < TOTAL; i++) {

        points.push({
            offset:
                (i / TOTAL) *
                Math.PI * 2
        });
    }
}

function drawText(x, y) {

    ctx.save();

    ctx.translate(x, y);

    ctx.font = "bold 15px Arial";

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.shadowColor = "#8b0000";
    ctx.shadowBlur = 12;

    ctx.fillStyle = "#b30000";

    ctx.fillText(
        TEXT,
        0,
        0
    );

    ctx.shadowColor = "#ff0000";
    ctx.shadowBlur = 25;

    ctx.fillStyle = "#cc0000";

    ctx.fillText(
        TEXT,
        0,
        0
    );

    ctx.shadowBlur = 4;

    ctx.fillStyle = "#ff3333";

    ctx.fillText(
        TEXT,
        0,
        0
    );

    ctx.restore();
}

function animate(time) {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    const pulse =
        1 +
        Math.sin(time * 0.003) *
        0.035;

    const movement =
        time * 0.00035;

    for (let i = 0; i < points.length; i++) {

        const p = points[i];

        const t =
            p.offset +
            movement;

        const pos =
            heart(t);

        const x =
            CX +
            pos.x * pulse;

        const y =
            CY +
            pos.y * pulse;

        drawText(x, y);
    }

    requestAnimationFrame(animate);
}

window.addEventListener(
    "resize",
    resize
);

resize();

requestAnimationFrame(animate);

</script>

</body>

</html>
